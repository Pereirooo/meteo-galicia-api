name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v

  test-postgres:
    runs-on: ubuntu-latest
    # A real PostgreSQL next to the job, same version as in compose.yaml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: meteo
          POSTGRES_PASSWORD: meteo
          POSTGRES_DB: meteo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meteo -d meteo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      METEO_TEST_DATABASE_URL: postgresql+psycopg://meteo:meteo@localhost:5432/meteo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
